[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "localcloud"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Local Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Networking & API
axum = "0.8"
hyper = { version = "1.8", features = ["full"] }
tower = "0.5"

# Discovery (Local Mesh)
mdns-sd = "0.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Encryption & Security
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = "0.14"
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
hyper-util = { version = "0.1.12", features = ["server-auto", "tokio"] }

# HTTP client
reqwest = { version = "0.12.28", features = ["rustls-tls", "json"], default-features = false }
rustls-pemfile = "2.2"

notify = { version = "6.1.1", features = ["macos_fsevent"] }
uuid = { version = "1.23.4", features = ["v4"] }

# FFI
uniffi = { version = "0.28", features = ["cli"] }