[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "localcloud"

[dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# Local Database
rusqlite = { version = "0.40.1", features = ["bundled"] }

# Networking & API
axum = "0.8.9"
hyper = { version = "1.11.0", features = ["full"] }
tower = "0.5.3"

# Discovery (Local Mesh)
mdns-sd = "0.20.3"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Error Handling
anyhow = "1.0.104"
thiserror = "2.0.19"

# Encryption & Security
rustls = { version = "0.23.43", features = ["ring"] }
tokio-rustls = "0.26.4"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rcgen = "0.14.8"
sha2 = "0.11"

rand = "0.9"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }

hex = "0.4.3"
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }

# HTTP client
reqwest = { version = "0.13.4", features = ["rustls-no-provider", "json"], default-features = false }
rustls-pemfile = "2.2.0"


uuid = { version = "1.24.0", features = ["v4"] }
whoami = "2.1.2"

# Watching a folder is a desktop idea. iOS cannot watch a user directory, and
# Android would need MANAGE_EXTERNAL_STORAGE, so neither links this at all.
# Bindings for Swift and Kotlin. The proc-macro flavour rather than a UDL file,
# so the interface is defined once, in the Rust that implements it. Needed on
# every target - mobile most of all.
uniffi = { version = "0.32", features = ["cli"] }

# Watching a folder is a desktop idea. iOS cannot watch a user directory, and
# Android would need MANAGE_EXTERNAL_STORAGE, so neither links this at all.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
notify = { version = "8.2", features = ["macos_fsevent"] }

[lints.rust]
# `desktop` is ours: "a platform where watching a folder makes sense".
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(desktop)'] }

[dev-dependencies]
tempfile = "3.27.0"
