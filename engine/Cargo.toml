[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }

# Local Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Networking & API
axum = "0.8"
hyper = { version = "1.8", features = ["full"] }
tower = "0.5"

# Discovery (Local Mesh)
mdns-sd = "0.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Encryption & Security
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
sha2 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
rand = "0.8"
hex = "0.4"
