[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "localcloud"

[dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# Local Database
rusqlite = { version = "0.40.1", features = ["bundled"] }

# Networking & API
axum = "0.8.9"
hyper = { version = "1.11.0", features = ["full"] }
tower = "0.5.3"

# Discovery (Local Mesh)
mdns-sd = "0.20.3"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Error Handling
anyhow = "1.0.104"
thiserror = "2.0.19"

# Encryption & Security
rustls = { version = "0.23.43", features = ["ring"] }
tokio-rustls = "0.26.4"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rcgen = "0.14.8"
sha2 = "0.10"

rand = "0.8"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }

hex = "0.4.3"
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }

# HTTP client
reqwest = { version = "0.12.28", features = ["rustls-tls", "json"], default-features = false }
rustls-pemfile = "2.2.0"

notify = { version = "6.1.1", features = ["macos_fsevent"] }
uuid = { version = "1.24.0", features = ["v4"] }
whoami = "2.1.2"

[dev-dependencies]
tempfile = "3.27.0"
